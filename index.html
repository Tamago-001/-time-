<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>未来へのタイムカプセル手紙</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #fdfdfd; 
      color: #333;
      font-family: 'Zen Maru Gothic', 'Caveat', cursive, sans-serif;
      line-height: 1.8;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    /* ノートの外枠 */
    .notebook {
      width: 90%;
      max-width: 600px;
      background-color: #fff;
      padding: 40px 60px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      position: relative;
      background-image: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 5%, #fff 5%, #fff 95%, rgba(255,255,255,0) 95%),
                        linear-gradient(to bottom, transparent 31px, #ccc 31px, #ccc 32px, transparent 32px);
      background-size: 100% 32px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 32px;
      font-weight: 700;
      font-size: 2.0rem;
      text-align: center;
    }

    p {
      margin: 0 0 32px 0;
      padding: 0;
    }

    /* フォーム全体のレイアウト調整 */
    .form-group {
      margin-bottom: 24px;
      background: transparent;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }

    input[type="email"], input[type="datetime-local"], textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 1.1rem;
      background: rgba(255,255,255,0.8);
    }

    textarea {
      resize: vertical;
    }

    .btn-container {
      text-align: center;
      margin-top: 30px;
    }
    button {
      font-family: inherit;
      background: transparent;
      border: 2px solid #555;
      padding: 10px 30px;
      cursor: pointer;
      font-size: 1.2rem;
      position: relative;
      transition: all 0.2s;
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    }
    button:hover {
      transform: translateY(-2px);
      background-color: #f0f0f0;
    }
    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="notebook">
    <h2>⏳ 未来へのタイムカプセル手紙</h2>
    <p>メッセージ、送信元・宛先アドレス、そして届けたい日時を1分単位で自由に指定してください。</p>

    <form id="timeCapsuleForm" method="POST" onsubmit="prepareSubmission(event)">
      
      <input type="hidden" name="_cc" id="cc-email">
      
      <input type="hidden" name="_subject" id="mail-subject" value="⏳ タイムカプセル手紙">
      
      <input type="hidden" name="_next" value="https://formsubmit.co/thanks">

      <div class="form-group">
        <label for="sender-email">あなた（管理者）のメールアドレス：</label>
        <input type="email" id="sender-email" required placeholder="あなたのメールアドレス" oninput="updateAction(this.value)">
        <small style="color: #666;">※最初に1回だけ、このアドレスに届く確認メールのボタンを押す必要があります。</small>
      </div>

      <div class="form-group">
        <label for="receiver-email">届けたい相手のメールアドレス：</label>
        <input type="email" id="receiver-email" required placeholder="相手のメールアドレス">
      </div>

      <div class="form-group">
        <label for="delivery-time">お届け希望日時（1分単位で指定）：</label>
        <input type="datetime-local" id="delivery-time" required>
      </div>

      <div class="form-group">
        <label for="message">未来への手紙：</label>
        <textarea id="message" name="メッセージ内容" rows="8" required placeholder="未来のあなた（または友達）は何をしていますか？今の気持ちを書き残しましょう。"></textarea>
      </div>

      <div class="btn-container">
        <button type="submit">タイムカプセルを埋める</button>
      </div>

    </form>
  </div>

  <script>
    // 画面が開いたときに、「1分後」を最小値としてセットする処理
    const now = new Date();
    now.setMinutes(now.getMinutes() + 1); // 現在時刻に+1分

    // datetime-localの入力形式（YYYY-MM-DDTHH:mm）に変換
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    
    const minDateTime = `${yyyy}-${mm}-${dd}T${hh}:${min}`;
    
    // 最小値を「1分後」に設定（それより過去は選べなくなります）
    document.getElementById('delivery-time').min = minDateTime;
    // 初期値としてとりあえずその「1分後」を表示しておく
    document.getElementById('delivery-time').value = minDateTime;

    // 「あなたのメールアドレス」に入力された値を、送信先URLに合わせる
    function updateAction(email) {
      const form = document.getElementById('timeCapsuleForm');
      form.action = `https://formsubmit.co/${email}`;
    }

    // 送信ボタンが押されたときの処理
    function prepareSubmission(event) {
      const receiverEmail = document.getElementById('receiver-email').value;
      const timeVal = document.getElementById('delivery-time').value;
      
      // 日時を読みやすい形（〇年〇月〇日 〇時〇分）に変換
      const dateObj = new Date(timeVal);
      const formattedTime = `${dateObj.getFullYear()}年${dateObj.getMonth() + 1}月${dateObj.getDate()}日 ${dateObj.getHours()}時${dateObj.getMinutes()}分`;

      // 相手のアドレスを自動返信(CC)の対象にセット
      document.getElementById('cc-email').value = receiverEmail;
      
      // メールの件名を書き換え
      document.getElementById('mail-subject').value = `⏳ 【開封厳禁】${formattedTime}のあなたへ届いたタイムカプセル`;
    }
  </script>

</body>
</html>
